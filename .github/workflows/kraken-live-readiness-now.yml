name: Kraken LIVE readiness now

on:
  push:
    branches: [ops/kraken-live-readiness-now]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Read temporary production-safe Kraken probe
        id: probe
        env:
          PROBE_URL: https://auto-bolsa-ai.k8mwkbp68y.workers.dev/api/ops/probe/kraken-20260810-ed735d0-b0c214b
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors "$PROBE_URL" > kraken-live-readiness-safe.json
          cat kraken-live-readiness-safe.json
          node <<'NODE'
          const d = require('./kraken-live-readiness-safe.json');
          if (d.readOnly !== true || d.realOrderCreated !== false) process.exit(2);
          NODE

      - name: Upload safe readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-live-readiness-now-${{ github.sha }}
          path: kraken-live-readiness-safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish diagnostic result
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            let payload = null;
            try { payload = JSON.parse(fs.readFileSync('kraken-live-readiness-safe.json','utf8')); } catch {}
            const body = {
              checkedAt: new Date().toISOString(),
              probeOutcome: process.env.PROBE_OUTCOME || 'unknown',
              result: payload,
              safety: 'READ_ONLY_DIAGNOSTIC_NO_REAL_ORDER',
            };
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Kraken LIVE readiness production · ${context.sha.slice(0,7)}`,
              body: ['```json', JSON.stringify(body, null, 2), '```'].join('\n'),
            });

      - name: Fail if production probe failed
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: test "$PROBE_OUTCOME" = "success"
