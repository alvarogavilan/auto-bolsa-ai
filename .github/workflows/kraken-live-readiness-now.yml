name: Kraken LIVE readiness now

on:
  push:
    branches: [ops/kraken-live-readiness-now]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check ADMIN_TOKEN availability
        id: token
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ADMIN_TOKEN GitHub secret is not available"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Probe Kraken gold readiness
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE_URL: https://auto-bolsa-ai.k8mwkbp68y.workers.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE_URL/api/kraken/gold-readiness" > kraken-gold-readiness.json
          node <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('kraken-gold-readiness.json','utf8'));
          console.log(JSON.stringify(d, null, 2));
          if (d.privateApi?.authenticated !== true) process.exit(2);
          if (d.privateApi?.balanceAvailable !== true) process.exit(3);
          if (d.privateApi?.permissionsSafe !== true) process.exit(4);
          if (d.readyForLivePreflight !== true) process.exit(5);
          if (d.realOrderSubmitted !== false) process.exit(6);
          NODE

      - name: Probe complete pilot readiness
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE_URL: https://auto-bolsa-ai.k8mwkbp68y.workers.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE_URL/api/pilot/readiness" > pilot-readiness.json
          node <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('pilot-readiness.json','utf8'));
          const safe = {
            schemaVersion: d.schemaVersion,
            eligibleForManualPilotReview: d.eligibleForManualPilotReview,
            previousPilotCycleVerified: d.previousPilotCycleVerified,
            blockers: d.blockers,
            warnings: d.warnings,
            sections: d.sections,
            accountCleanliness: d.accountCleanliness,
            fireDrill: d.fireDrill,
            liveTrading: d.liveTrading,
          };
          fs.writeFileSync('pilot-readiness-safe.json', JSON.stringify(safe, null, 2));
          console.log(JSON.stringify(safe, null, 2));
          NODE

      - name: Refresh Kraken account cleanliness
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE_URL: https://auto-bolsa-ai.k8mwkbp68y.workers.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE_URL/api/pilot/audit-account" > kraken-account-audit.json
          node -e 'const d=require("./kraken-account-audit.json"); console.log(JSON.stringify(d,null,2)); if(d.realOrderCreated!==false) process.exit(7)'

      - name: Upload safe readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-live-readiness-now-${{ github.sha }}
          path: |
            kraken-gold-readiness.json
            pilot-readiness.json
            pilot-readiness-safe.json
            kraken-account-audit.json
          if-no-files-found: warn
          retention-days: 7
