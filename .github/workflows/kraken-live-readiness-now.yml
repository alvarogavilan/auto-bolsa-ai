name: Kraken LIVE readiness now

on:
  push:
    branches: [ops/kraken-live-readiness-now]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Read temporary production-safe Kraken probe
        id: probe
        continue-on-error: true
        env:
          PROBE_URL: https://auto-bolsa-ai.k8mwkbp68y.workers.dev/api/ops/probe/kraken-20260810-ed735d0-b0c214b
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 5 --retry-all-errors -o kraken-live-readiness-safe.raw -w '%{http_code}' "$PROBE_URL")
          echo "http_status=$code" >> "$GITHUB_OUTPUT"
          cat kraken-live-readiness-safe.raw || true
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('kraken-live-readiness-safe.raw','utf8');
          let parsed = null;
          try { parsed = JSON.parse(raw); } catch {}
          fs.writeFileSync('kraken-live-readiness-safe.json', JSON.stringify({ raw, parsed }, null, 2));
          if (!parsed || parsed.readOnly !== true || parsed.realOrderCreated !== false) process.exit(2);
          NODE

      - name: Upload safe readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-live-readiness-now-${{ github.sha }}
          path: |
            kraken-live-readiness-safe.raw
            kraken-live-readiness-safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish diagnostic result
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
        with:
          script: |
            const fs = require('node:fs');
            let evidence = null;
            try { evidence = JSON.parse(fs.readFileSync('kraken-live-readiness-safe.json','utf8')); } catch {}
            const body = {
              checkedAt: new Date().toISOString(),
              runId: context.runId,
              probeOutcome: process.env.PROBE_OUTCOME || 'unknown',
              httpStatus: process.env.HTTP_STATUS || null,
              result: evidence?.parsed ?? null,
              raw: evidence?.parsed ? null : evidence?.raw ?? null,
              safety: 'READ_ONLY_DIAGNOSTIC_NO_REAL_ORDER',
            };
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Kraken LIVE readiness production · ${context.sha.slice(0,7)}`,
              body: ['```json', JSON.stringify(body, null, 2), '```'].join('\n'),
            });

      - name: Fail if production probe failed
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
        run: |
          test "$PROBE_OUTCOME" = "success"
          test "$HTTP_STATUS" = "200"
