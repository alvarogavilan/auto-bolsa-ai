name: Radar hourly snapshot

# Pide el Radar Mundial una vez por hora para que el Worker guarde una muestra
# tono + precio. Con esas muestras se calcula si el radar acierta de verdad.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REPOSITORY_WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
    steps:
      - name: Request radar
        shell: bash
        run: |
          set -euo pipefail
          base="${REPOSITORY_WORKER_BASE_URL:-}"
          if [ -z "$base" ]; then base="https://auto-bolsa-ai.k8mwkbp68y.workers.dev"; fi
          base="${base%/}"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 "$base/api/radar" -o radar.json
          node -e "const r=require('./radar.json');console.log('fuentes',r.sourcesAvailable+'/'+r.sourcesConfigured,'titulares',r.itemsAnalysed)"

  # Diagnóstico manual de producción: estado HTTP y comienzo de cada respuesta.
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPOSITORY_WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
    steps:
      - name: Probe production endpoints
        shell: bash
        run: |
          base="${REPOSITORY_WORKER_BASE_URL:-}"
          if [ -z "$base" ]; then base="https://auto-bolsa-ai.k8mwkbp68y.workers.dev"; fi
          base="${base%/}"
          for path in /health /api/demo /api/xau/status /api/xau/readiness /api/order-now /api/signals/status /api/telegram/readiness /api/radar/track-record /api/world-markets /api/radar /manifest.webmanifest /; do
            code=$(curl -sS -o body.txt -w '%{http_code} %{size_download}B %{time_total}s' --max-time 60 "$base$path" || echo "curl-failed")
            echo "=== $path -> $code"
            if [ "$path" = "/api/radar" ]; then
              node -e "try{const r=JSON.parse(require('fs').readFileSync('body.txt','utf8'));console.log('fuentes',r.sourcesAvailable+'/'+r.sourcesConfigured,'titulares',r.itemsAnalysed);for(const s of r.sourceStatus)if(!s.available)console.log('  KO',s.id,s.error)}catch(e){console.log(String(e))}"
            else
              head -c 700 body.txt; echo
            fi
          done

      - name: Probe candidate free sources
        shell: bash
        run: |
          ua="Mozilla/5.0 (compatible; AutoBolsaRadar/1.0; research-only)"
          probe() { code=$(curl -sS -L -A "$ua" -o body.txt -w '%{http_code} %{size_download}B %{time_total}s' --max-time 20 "$1" || echo curl-failed); echo "=== $1 -> $code"; head -c 260 body.txt | tr '\n' ' '; echo; }
          probe "https://stooq.com/q/l/?s=%5Espx,eurusd,xauusd,aapl.us&f=sd2t2ohlcv&h&e=csv"
          probe "https://stooq.com/q/l/?s=%5Espx,%5Endq,%5Edji,%5Edax,%5Eibex,%5Eukx,%5Enkx,%5Ehsi,eurusd,usdjpy,gbpusd,xauusd,xagusd,cl.f,ng.f,hg.f,btcusd,ethusd,aapl.us,msft.us,nvda.us,amzn.us,googl.us,meta.us,tsla.us,jpm.us,xom.us,nem.us,coin.us,mstr.us&f=sd2t2ohlcv&h&e=csv"
          probe "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1d&interval=1d"
          probe "https://query1.finance.yahoo.com/v7/finance/spark?symbols=%5EGSPC,%5EIBEX,EURUSD%3DX,GC%3DF,AAPL&range=1d&interval=1d"
          probe "https://finance.yahoo.com/rss/topstories"
          probe "https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5EGSPC&region=US&lang=en-US"
          probe "https://www.kitco.com/news/category/mining/rss"
          probe "https://www.kitco.com/rss"
          probe "https://www.fxstreet.com/rss/news"
          probe "https://www.investing.com/rss/news_11.rss"
          probe "https://www.coindesk.com/arc/outboundfeeds/rss/"
          probe "https://api.alternative.me/fng/?limit=1"
          probe "https://api.coingecko.com/api/v3/search/trending"
          probe "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=40&output=atom"
          probe "https://api.telegram.org/"
