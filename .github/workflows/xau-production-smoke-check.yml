name: XAU production smoke check

on:
  workflow_dispatch:
    inputs:
      worker_base_url:
        description: "URL pública del Worker (opcional si existe WORKER_BASE_URL)"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  verify-xau-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPOSITORY_WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      MANUAL_WORKER_BASE_URL: ${{ inputs.worker_base_url }}
    steps:
      - name: Resolve production URL
        shell: bash
        run: |
          set -euo pipefail
          candidate="${MANUAL_WORKER_BASE_URL:-}"
          if [ -z "$candidate" ]; then candidate="${REPOSITORY_WORKER_BASE_URL:-}"; fi
          candidate="${candidate%/}"
          if [ -z "$candidate" ]; then
            echo "No production URL available. Configure WORKER_BASE_URL or supply worker_base_url when dispatching manually."
            exit 1
          fi
          case "$candidate" in
            https://*) ;;
            *) echo "Production URL must use HTTPS."; exit 1 ;;
          esac
          echo "WORKER_BASE_URL=$candidate" >> "$GITHUB_ENV"

      - name: Fetch XAU readiness and status
        shell: bash
        run: |
          set -euo pipefail
          base="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$base/api/xau/readiness" -o xau-readiness.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$base/api/xau/status" -o xau-status.json

      - name: Validate PAPER safety and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const readiness = JSON.parse(fs.readFileSync('xau-readiness.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('xau-status.json', 'utf8'));

          const fail = (message) => {
            console.error(message);
            process.exitCode = 1;
          };

          if (readiness.schemaVersion !== 'xau-usd-paper-readiness-v6') {
            fail(`Unexpected readiness schema: ${readiness.schemaVersion}`);
          }
          if (readiness.mode !== 'paper') fail(`Unexpected mode: ${readiness.mode}`);
          if (readiness.liveTrading !== false) fail('LIVE must remain disabled.');
          if (readiness.realOrderSubmission !== false) fail('Real order submission must remain disabled.');
          if (readiness.operational !== true) fail('XAU PAPER runtime is not operational.');
          if (!Number.isFinite(readiness.decisionCycles)) fail('decisionCycles missing.');
          if (!Number.isFinite(readiness.monitoringSamples)) fail('monitoringSamples missing.');
          if (!Array.isArray(readiness.latestDecisionBlockers)) fail('latestDecisionBlockers missing.');
          if (!Object.prototype.hasOwnProperty.call(readiness, 'dominantBlocker')) fail('dominantBlocker missing.');
          if (!status || typeof status !== 'object') fail('Invalid XAU status payload.');

          console.log(JSON.stringify({
            schemaVersion: readiness.schemaVersion,
            operational: readiness.operational,
            decisionCycles: readiness.decisionCycles,
            approvedDecisionCycles: readiness.approvedDecisionCycles,
            blockedDecisionCycles: readiness.blockedDecisionCycles,
            monitoringSamples: readiness.monitoringSamples,
            dominantBlocker: readiness.dominantBlocker,
            dominantBlockerCount: readiness.dominantBlockerCount,
            latestDecisionOutcome: readiness.latestDecisionOutcome,
            latestDecisionBlockers: readiness.latestDecisionBlockers,
            liveTrading: readiness.liveTrading,
            realOrderSubmission: readiness.realOrderSubmission,
          }, null, 2));
          NODE

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-production-evidence
          path: |
            xau-readiness.json
            xau-status.json
          if-no-files-found: warn
          retention-days: 14
