name: Recortar clips GTA 6

on:
  # Botón manual: GitHub (app o web) → Actions → "Recortar clips GTA 6" → Run workflow
  workflow_dispatch:
    inputs:
      enlaces:
        description: "Uno o varios enlaces (YouTube, Twitch, Kick), separados por espacios. Cada uno se procesa en paralelo. Vacío = revisar campañas"
        required: false
        default: ""
      tramo:
        description: "Opcional, para directos largos: tramo a usar, p.ej. 1:00:00-1:40:00"
        required: false
        default: ""
      clips:
        description: "Clips por vídeo"
        required: false
        default: "6"
      duracion:
        description: "Segundos por clip"
        required: false
        default: "30"
      handle:
        description: "@ que aparece en el vídeo (tu canal o el del streamer)"
        required: false
        default: ""
      horas:
        description: "Solo sin enlaces: buscar directos de campañas terminados en las últimas N horas"
        required: false
        default: "2.2"
  # Seguimiento automático: cada 2 horas busca directos nuevos de GTA 6 de tus campañas
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: read

concurrency:
  group: gta6-clips-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  TZ: Europe/Madrid   # horas de publicación sugeridas en hora de España

jobs:
  # 1. Reparte el trabajo: un "trabajador" (servidor) por vídeo
  repartir:
    runs-on: ubuntu-latest
    outputs:
      trabajos: ${{ steps.lista.outputs.trabajos }}
      hay: ${{ steps.lista.outputs.hay }}
    defaults:
      run:
        working-directory: gta6-clips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # El "equipo de análisis": tendencias de Shorts + directos y VODs de Twitch
      - name: Radar viral (YouTube Shorts + Twitch)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          HORAS: ${{ inputs.horas }}
        run: python radar_viral.py --campanas campanas.seguimiento.json --horas-vods "${HORAS:-2.2}" --salida radar || true
      - name: Guardar radar
        uses: actions/upload-artifact@v4
        with:
          name: radar-viral
          path: gta6-clips/radar/
          retention-days: 7
          if-no-files-found: ignore
      - name: Recordar vídeos ya recortados
        uses: actions/cache@v4
        with:
          path: gta6-clips/estado
          key: gta6-procesados-v2-${{ github.run_id }}
          restore-keys: gta6-procesados-v2-
      - name: Lista de vídeos a recortar
        id: lista
        env:
          ENLACES: ${{ inputs.enlaces }}
          TRAMO: ${{ inputs.tramo }}
          CLIPS: ${{ inputs.clips || '6' }}
          DURACION: ${{ inputs.duracion || '30' }}
          HANDLE: ${{ inputs.handle }}
          HORAS: ${{ inputs.horas }}
        run: |
          if [ -n "$ENLACES" ]; then
            trabajos=$(python - <<'EOF'
          import json, os, re
          urls = [u for u in re.split(r"[\s,]+", os.environ["ENLACES"]) if u][:20]
          print(json.dumps([{"url": u, "titulo": u[-40:], "handle": os.environ["HANDLE"],
                             "clips": os.environ["CLIPS"], "duracion": os.environ["DURACION"],
                             "tramo": os.environ["TRAMO"], "tags": ""} for u in urls]))
          EOF
            )
          elif [ -s radar/objetivos.json ] && [ "$(cat radar/objetivos.json)" != "[]" ]; then
            trabajos=$(cat radar/objetivos.json)   # objetivos elegidos por el radar (Twitch API)
          else
            pip install -q numpy yt-dlp
            trabajos=$(python boton.py --seguimiento campanas.seguimiento.json --horas "${HORAS:-2.2}" --procesados estado/procesados.txt --listar-json || echo "[]")
          fi
          [ -z "$trabajos" ] && trabajos="[]"
          if [ "$trabajos" != "[]" ]; then   # trocea directos largos en tramos de 90 min
            pip install -q numpy yt-dlp
            trabajos=$(python boton.py --expandir "$trabajos" || echo "$trabajos")
          fi
          echo "trabajos=$trabajos" >> "$GITHUB_OUTPUT"
          if [ "$trabajos" = "[]" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "No hay vídeos nuevos de GTA 6 en tus campañas (o falta campanas.seguimiento.json)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

  # 2. Cada vídeo en su propio servidor, todos a la vez
  recortar:
    needs: repartir
    if: needs.repartir.outputs.hay == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        trabajo: ${{ fromJSON(needs.repartir.outputs.trabajos) }}
    name: "Recortar ${{ matrix.trabajo.titulo }}"
    defaults:
      run:
        working-directory: gta6-clips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liberar disco (los directos ocupan mucho)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Instalar ffmpeg y dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q numpy yt-dlp
      - name: Traer tendencias del radar
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: radar-viral
          path: gta6-clips/radar
      - name: Descargar y recortar
        env:
          URL: ${{ matrix.trabajo.url }}
          TRAMO: ${{ matrix.trabajo.tramo }}
          CLIPS: ${{ matrix.trabajo.clips }}
          DURACION: ${{ matrix.trabajo.duracion }}
          HANDLE: ${{ matrix.trabajo.handle }}
          TAGS: ${{ matrix.trabajo.tags }}
        run: python boton.py --url "$URL" --tramo "$TRAMO" -n "$CLIPS" --duracion "$DURACION" --handle "$HANDLE" --tags "$TAGS" --tendencias radar/tendencias.json --borrar-original
      - name: Textos por plataforma (TikTok, Shorts, Reels, X)
        if: always()
        env:
          HANDLE: ${{ matrix.trabajo.handle }}
        run: |
          for d in clips/*/; do
            [ -f "$d/clips.json" ] && python ../gta6-pagina/pagina.py cola "$d" --credito "$HANDLE" || true
          done
      - name: Subir clips para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-gta6-${{ strategy.job-index }}
          path: gta6-clips/clips/
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
