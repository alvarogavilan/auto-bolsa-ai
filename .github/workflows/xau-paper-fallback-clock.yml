name: XAU PAPER Fallback Clock

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/index-paper-fallback-clock.ts"
      - "wrangler.jsonc"
      - ".github/workflows/xau-paper-fallback-clock.yml"

permissions:
  contents: read

concurrency:
  group: xau-paper-fallback-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment on push
        if: github.event_name == 'push'
        run: sleep 120

      - name: Invoke PAPER-only XAU clock
        run: |
          set -euo pipefail
          base="https://auto-bolsa-ai.k8mwkbp68y.workers.dev"
          curl -fsS --retry 3 --retry-all-errors -X POST "$base/api/xau/paper-clock" -o clock.json
          cat clock.json
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('clock.json', 'utf8'));
          if (c.ok !== true || c.mode !== 'paper') throw new Error(`PAPER clock rejected: ${JSON.stringify(c)}`);
          if (c.liveTrading !== false || c.realOrderSubmission !== false) throw new Error('PAPER clock safety regression');
          NODE

      - name: Verify fresh persisted XAU decision
        run: |
          set -euo pipefail
          base="https://auto-bolsa-ai.k8mwkbp68y.workers.dev"
          curl -fsS --retry 3 --retry-all-errors "$base/api/xau/readiness" -o readiness.json
          node <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('readiness.json', 'utf8'));
          const evidence = {
            checkedAt: new Date().toISOString(),
            operational: r.operational,
            schedulerStalled: r.schedulerStalled,
            latestDecisionObservedAt: r.latestDecisionObservedAt,
            latestDecisionAgeMs: r.latestDecisionAgeMs,
            decisionCycles: r.decisionCycles,
            monitoringSamples: r.monitoringSamples,
            feedDiagnostic: r.feedDiagnostic,
            liveTrading: r.liveTrading,
            realOrderSubmission: r.realOrderSubmission,
          };
          console.log(JSON.stringify(evidence, null, 2));
          if (r.liveTrading !== false || r.realOrderSubmission !== false) throw new Error('LIVE must remain disabled');
          if (r.feedDiagnostic?.ok !== true) throw new Error(`XAU feed unavailable: ${r.feedDiagnostic?.error ?? 'unknown'}`);
          if (!(typeof r.latestDecisionAgeMs === 'number' && r.latestDecisionAgeMs <= 90000)) throw new Error(`Fallback clock did not persist a fresh decision: ${r.latestDecisionAgeMs}`);
          NODE
