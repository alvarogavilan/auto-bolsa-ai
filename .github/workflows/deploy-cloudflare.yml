name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify Worker
        run: |
          npm run typecheck:worker
          npm run typecheck:test
          npm test

      - name: Resolve Cloudflare account
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "missing=CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"; exit 1)
          response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts")
          account_id=$(node -e 'const d=JSON.parse(process.argv[1]); const a=d.result?.[0]?.id; if(!d.success || !a) process.exit(1); process.stdout.write(a)' "$response")
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Deploy PAPER DEMO
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Confirm deployment metadata
        id: metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: npx wrangler deployments list

      - name: Smoke test DEMO
        id: smoke
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          base="$DEPLOY_URL"
          if [ -z "$base" ]; then base="https://auto-bolsa-ai.k8mwkbp68y.workers.dev"; fi
          curl -fsS "$base/api/demo" > demo.json
          node -e 'const d=require("./demo.json"); if(d.mode!=="paper" || d.liveTrading!==false || d.realOrdersEnabled!==false) process.exit(1)'
          echo "url=$base" >> "$GITHUB_OUTPUT"

      - name: Capture XAU production evidence
        id: xau
        env:
          DEPLOY_URL: ${{ steps.smoke.outputs.url || steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          base="$DEPLOY_URL"
          if [ -z "$base" ]; then base="https://auto-bolsa-ai.k8mwkbp68y.workers.dev"; fi
          curl -fsS --retry 3 --retry-all-errors "$base/api/xau/readiness" -o xau-readiness.json
          curl -fsS --retry 3 --retry-all-errors "$base/api/xau/status" -o xau-status.json
          node <<'NODE'
          const fs = require('node:fs');
          const readiness = JSON.parse(fs.readFileSync('xau-readiness.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('xau-status.json', 'utf8'));
          const diagnostics = readiness.blockerDiagnostics ?? {};
          const summary = {
            observedAt: new Date().toISOString(),
            schemaVersion: readiness.schemaVersion,
            mode: readiness.mode,
            operational: readiness.operational,
            feedMode: readiness.feedMode,
            decisionCycles: readiness.decisionCycles,
            approvedDecisionCycles: readiness.approvedDecisionCycles,
            blockedDecisionCycles: readiness.blockedDecisionCycles,
            monitoringSamples: readiness.monitoringSamples,
            latestDecisionOutcome: readiness.latestDecisionOutcome,
            latestDecisionBlockers: readiness.latestDecisionBlockers,
            blockerDiagnostics: diagnostics,
            status,
            liveTrading: readiness.liveTrading,
            realOrderSubmission: readiness.realOrderSubmission,
          };
          if (summary.schemaVersion !== 'xau-usd-paper-readiness-v6') throw new Error(`Unexpected schema: ${summary.schemaVersion}`);
          if (summary.mode !== 'paper') throw new Error(`Unexpected mode: ${summary.mode}`);
          if (summary.liveTrading !== false) throw new Error('LIVE must remain disabled.');
          if (summary.realOrderSubmission !== false) throw new Error('Real order submission must remain disabled.');
          fs.writeFileSync('xau-production-summary.json', JSON.stringify(summary, null, 2));
          NODE

      - name: Upload XAU production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-production-evidence-${{ github.sha }}
          path: |
            xau-readiness.json
            xau-status.json
            xau-production-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish XAU production evidence
        if: always() && steps.xau.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const summary = JSON.parse(fs.readFileSync('xau-production-summary.json', 'utf8'));
            const status = summary.status ?? {};
            const positionBook = status.positionBook ?? null;
            const treasury = positionBook?.treasury ?? null;
            const compact = {
              observedAt: summary.observedAt,
              schemaVersion: summary.schemaVersion,
              mode: summary.mode,
              operational: summary.operational,
              feedMode: summary.feedMode,
              decisionCycles: summary.decisionCycles,
              approvedDecisionCycles: summary.approvedDecisionCycles,
              blockedDecisionCycles: summary.blockedDecisionCycles,
              monitoringSamples: summary.monitoringSamples,
              latestDecisionOutcome: summary.latestDecisionOutcome,
              latestDecisionBlockers: summary.latestDecisionBlockers,
              blockerDiagnostics: summary.blockerDiagnostics,
              ledgerMetrics: status.metrics ?? null,
              openPosition: positionBook?.open ?? null,
              treasury: treasury ? {
                initialCapitalEur: treasury.initialCapitalEur,
                cashEur: treasury.cashEur,
                committedCapitalEur: treasury.committedCapitalEur,
                realizedPnlEur: treasury.realizedPnlEur,
                unrealizedPnlEur: treasury.unrealizedPnlEur,
                equityEur: treasury.equityEur,
                availableCapitalEur: treasury.availableCapitalEur,
              } : null,
              liveTrading: summary.liveTrading,
              realOrderSubmission: summary.realOrderSubmission,
            };
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Commit: \`${context.sha}\``,
              `Evidencia completa: artefacto \`xau-production-evidence-${context.sha}\` del workflow ${runUrl}`,
              '',
              '```json',
              JSON.stringify(compact, null, 2),
              '```',
            ].join('\n');
            if (body.length >= 60000) throw new Error(`Compact XAU evidence unexpectedly too large: ${body.length}`);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `XAU production evidence · ${context.sha.slice(0, 7)}`,
              body,
            });

      - name: Publish deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          MISSING_SECRETS: ${{ steps.credentials.outputs.missing }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.smoke.outputs.url || steps.deploy.outputs.url }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          XAU_OUTCOME: ${{ steps.xau.outcome }}
        with:
          script: |
            const success = process.env.CREDENTIALS_OUTCOME === 'success' && process.env.DEPLOY_OUTCOME === 'success' && process.env.SMOKE_OUTCOME === 'success' && process.env.XAU_OUTCOME === 'success';
            const title = success
              ? `Cloudflare deploy OK · ${context.sha.slice(0, 7)}`
              : `Cloudflare deploy BLOCKED · ${context.sha.slice(0, 7)}`;
            const body = [
              `Commit: \`${context.sha}\``,
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Credenciales: **${process.env.CREDENTIALS_OUTCOME || 'unknown'}**`,
              process.env.MISSING_SECRETS ? `Secretos ausentes: \`${process.env.MISSING_SECRETS}\`` : null,
              `Despliegue: **${process.env.DEPLOY_OUTCOME || 'skipped'}**`,
              process.env.DEPLOY_URL ? `URL pública: ${process.env.DEPLOY_URL}` : null,
              `Metadata: **${process.env.METADATA_OUTCOME || 'skipped'}**`,
              `Smoke test /api/demo: **${process.env.SMOKE_OUTCOME || 'skipped'}**`,
              `Evidencia XAU: **${process.env.XAU_OUTCOME || 'skipped'}**`,
              '',
              'Seguridad: PAPER activo; LIVE y órdenes reales permanecen desactivados.'
            ].filter(Boolean).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Fail when deployment did not complete
        if: always() && (steps.credentials.outcome != 'success' || steps.deploy.outcome != 'success' || steps.smoke.outcome != 'success' || steps.xau.outcome != 'success')
        run: exit 1

# Triggered after repository secret creation.
