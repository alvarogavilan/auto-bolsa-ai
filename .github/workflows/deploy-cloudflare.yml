name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify Worker
        run: |
          npm run typecheck:worker
          npm run typecheck:test
          npm test

      - name: Check Cloudflare credentials
        id: credentials
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          test -n "$CLOUDFLARE_API_TOKEN" || missing="${missing} CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID" || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Deploy PAPER DEMO
        id: deploy
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Confirm deployment metadata
        id: metadata
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list

      - name: Publish deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          MISSING_SECRETS: ${{ steps.credentials.outputs.missing }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        with:
          script: |
            const success = process.env.CREDENTIALS_OUTCOME === 'success' && process.env.DEPLOY_OUTCOME === 'success';
            const title = success
              ? `Cloudflare deploy OK · ${context.sha.slice(0, 7)}`
              : `Cloudflare deploy BLOCKED · ${context.sha.slice(0, 7)}`;
            const body = [
              `Commit: \`${context.sha}\``,
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Credenciales: **${process.env.CREDENTIALS_OUTCOME || 'unknown'}**`,
              process.env.MISSING_SECRETS ? `Secretos ausentes: \`${process.env.MISSING_SECRETS}\`` : null,
              `Despliegue: **${process.env.DEPLOY_OUTCOME || 'skipped'}**`,
              process.env.DEPLOY_URL ? `URL pública: ${process.env.DEPLOY_URL}` : null,
              `Metadata: **${process.env.METADATA_OUTCOME || 'skipped'}**`,
              '',
              'Seguridad: PAPER activo; LIVE y órdenes reales permanecen desactivados.'
            ].filter(Boolean).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Fail when deployment did not complete
        if: always() && (steps.credentials.outcome != 'success' || steps.deploy.outcome != 'success')
        run: exit 1
