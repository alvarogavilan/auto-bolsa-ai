name: Kraken readiness now 2026-08-12

on:
  push:
    branches: [ops/kraken-readiness-now-20260812]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Read production-safe Kraken probe once
        id: probe
        continue-on-error: true
        env:
          PROBE_URL: https://auto-bolsa-ai.k8mwkbp68y.workers.dev/api/ops/probe/kraken-20260810-ed735d0-b0c214b
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o kraken-probe.raw -w '%{http_code}' "$PROBE_URL")
          echo "http_status=$code" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('kraken-probe.raw','utf8');
          let parsed = null;
          try { parsed = JSON.parse(raw); } catch {}
          fs.writeFileSync('kraken-probe.json', JSON.stringify({parsed,raw:parsed?null:raw},null,2));
          console.log(JSON.stringify(parsed ?? {raw},null,2));
          NODE

      - name: Publish safe diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            let evidence = null;
            try { evidence = JSON.parse(fs.readFileSync('kraken-probe.json','utf8')); } catch {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Kraken readiness now · ${context.sha.slice(0,7)}`,
              body: ['```json', JSON.stringify({checkedAt:new Date().toISOString(),runId:context.runId,httpStatus:process.env.HTTP_STATUS||null,probeOutcome:process.env.PROBE_OUTCOME||null,result:evidence?.parsed??null,raw:evidence?.raw??null,safety:'READ_ONLY_NO_ORDER'},null,2), '```'].join('\n'),
            });

      - name: Require successful safe probe
        if: always()
        env:
          HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          test "$PROBE_OUTCOME" = "success"
          test "$HTTP_STATUS" = "200"
