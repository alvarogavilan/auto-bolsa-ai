name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Verify Worker
        shell: bash
        run: |
          set -o pipefail
          {
            npm run typecheck:worker
            npm run typecheck:test
            npm test
          } 2>&1 | tee verify-worker.log
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-worker-log
          path: verify-worker.log
          if-no-files-found: warn
