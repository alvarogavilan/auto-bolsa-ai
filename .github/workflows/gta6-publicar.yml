name: Publicar clips listos

# Cuando termina un recorte, junta los clips de todos los servidores, los ordena
# de mejor a peor y crea la página «Clips listos» (una release con cada vídeo
# descargable por separado). Enlace fijo: /releases/latest
on:
  workflow_run:
    workflows: ["Recortar clips GTA 6"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de la ejecución de 'Recortar clips GTA 6' a publicar"
        required: true
      borrar_tag:
        description: "Opcional: etiqueta de una página antigua a borrar (p.ej. clips-123)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      # App pública (GitHub Pages): se activa al crear el secreto PUBLIC_CLIPS_TOKEN
      PUB_TOKEN: ${{ secrets.PUBLIC_CLIPS_TOKEN }}
      PUB_REPO: ${{ vars.PUBLIC_CLIPS_REPO || 'alvarogavilan/aldiagta6-clips' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer los clips de todos los servidores
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: clips-gta6-*
          path: todos
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Ordenar y preparar la página
        id: prep
        run: |
          pip install -q numpy
          mkdir -p todos
          python gta6-clips/publicar.py todos --salida salida --top 15
          if ls salida/*.mp4 >/dev/null 2>&1; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar «Clips listos»
        if: steps.prep.outputs.hay == 'si'
        run: |
          fecha=$(date +"%d/%m %H:%M")
          if gh release view "clips-${RUN_ID}" > /dev/null 2>&1; then
            gh release upload "clips-${RUN_ID}" salida/*.mp4 --clobber
            gh release edit "clips-${RUN_ID}" --notes-file salida/notas.md --latest
          else
            gh release create "clips-${RUN_ID}" salida/*.mp4 \
              --title "🎬 Clips listos · ${fecha}" --notes-file salida/notas.md --latest
          fi
          cat salida/notas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Actualizar la app (GitHub Pages)
        if: steps.prep.outputs.hay == 'si' && env.PUB_TOKEN != ''
        run: |
          set -e
          export GH_TOKEN="$PUB_TOKEN"
          visibles=$(gh api /user/repos --paginate -q '.[].full_name' 2>/dev/null || true)
          echo "Repositorios que ve la llave: $(echo $visibles)"
          if ! gh api "repos/$PUB_REPO" > /dev/null 2>&1; then
            found=$(echo "$visibles" | tr ' ' '\n' | grep -i 'aldiagta6-clips' | head -1 || true)
            if [ -z "$found" ]; then
              echo "::error::La llave no tiene acceso al repositorio de clips. Créala eligiendo ese repositorio en 'Only select repositories'."
              exit 1
            fi
            PUB_REPO="$found"; export PUB_REPO
            echo "Usando $PUB_REPO"
          fi
          TAG="clips-${RUN_ID}"
          owner="${PUB_REPO%%/*}"; name="${PUB_REPO#*/}"
          gh release create "$TAG" salida/*.mp4 --repo "$PUB_REPO" --title "Clips ${TAG}" \
            --notes "Clips de GTA 6 Al Día" --latest \
            || gh release upload "$TAG" salida/*.mp4 --repo "$PUB_REPO" --clobber
          python - <<'EOF'
          import json, os
          d = json.load(open("salida/clips.json", encoding="utf-8"))
          repo, tag = os.environ["PUB_REPO"], "clips-" + os.environ["RUN_ID"]
          d["tag"] = tag
          d["base"] = f"https://github.com/{repo}/releases/download/{tag}/"
          d["recortar"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/gta6-clips.yml"
          try:
              camps = json.load(open("gta6-clips/campanas.seguimiento.json", encoding="utf-8"))["campanas"]
              d["campana"] = next((c["permiso"] for c in camps if c.get("permiso")), "")
          except Exception:
              d["campana"] = ""
          json.dump(d, open("app-clips.json", "w", encoding="utf-8"), ensure_ascii=False)
          EOF
          put() {
            sha=$(gh api "repos/$PUB_REPO/contents/$1" -q .sha 2>/dev/null || true)
            args=(-X PUT "repos/$PUB_REPO/contents/$1" -f message="Actualizar $1" -f content="$(base64 -w0 "$2")")
            [ -n "$sha" ] && args+=(-f sha="$sha")
            gh api "${args[@]}" > /dev/null
          }
          put index.html gta6-app/index.html
          put data/clips.json app-clips.json
          if ! gh api "repos/$PUB_REPO/pages" -q '"Pages: " + .status + " · " + .html_url' 2>/dev/null; then
            echo "Pages no estaba activo: lo activo"
            gh api -X POST "repos/$PUB_REPO/pages" -f "source[branch]=main" -f "source[path]=/" -q .html_url \
              || echo "::warning::No pude activar GitHub Pages con la llave. Actívalo en Settings → Pages → Deploy from a branch → main / (root)."
          fi
          gh release list --repo "$PUB_REPO" --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^clips-' | tail -n +4 | xargs -r -I{} gh release delete {} --repo "$PUB_REPO" --yes --cleanup-tag || true
          owner="${PUB_REPO%%/*}"; name="${PUB_REPO#*/}"
          echo "📱 App: https://${owner}.github.io/${name}/" >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar la página indicada
        if: inputs.borrar_tag != ''
        env:
          TAG: ${{ inputs.borrar_tag }}
        run: gh release delete "$TAG" --yes --cleanup-tag || true
      - name: Borrar páginas antiguas (deja las 8 últimas)
        if: steps.prep.outputs.hay == 'si'
        run: |
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^clips-' | tail -n +9 | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true
