name: Probar aviso en el móvil

# Manda un aviso de prueba a la app ntfy del iPhone para comprobar que llegan.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar aviso de prueba
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "::error::Falta el secreto NTFY_TOPIC"; exit 1; fi
          python gta6-clips/avisos.py ninguno --prueba
