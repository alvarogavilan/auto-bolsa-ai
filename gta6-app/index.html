<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Clips GTA 6">
<meta name="theme-color" content="#14111c">
<title>Clips GTA 6 Al Día</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Una columna de móvil: tarjeta grande "Sube este ahora" y debajo la cola por orden */
:root{
  --bg:#f5f3f8; --card:#ffffff; --ink:#1b1724; --muted:#6b6478; --line:#e3dfea;
  --sunset:#e8487d; --sunset-soft:#fde6ee; --palm:#12866f; --palm-soft:#dff3ee; --amber:#a86400;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14111c; --card:#1e1a29; --ink:#f1edf7; --muted:#a69fb3; --line:#2e2840;
  --sunset:#ff6a9a; --sunset-soft:#3a1828; --palm:#3fd0ae; --palm-soft:#123329; --amber:#f2b04a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.05rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
header{display:flex;flex-direction:column;gap:6px}
.meta{color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--palm);width:0;transition:width .3s}
.now{background:var(--card);border:2px solid var(--sunset);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.now .tag{align-self:flex-start;background:var(--sunset);color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.when{font-family:var(--display);font-size:1.25rem;font-weight:700}
.why{color:var(--muted);font-size:.88rem}
.hook{background:var(--sunset-soft);border-radius:10px;padding:8px 12px;font-size:.92rem}
video{width:100%;max-height:45vh;margin:0 14px 14px;width:calc(100% - 28px);border-radius:12px;background:#000;aspect-ratio:9/16;object-fit:contain}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:600 .95rem var(--body);text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--sunset);border-color:var(--sunset);color:#fff;grid-column:1/-1;font-size:1.05rem}
.btn.done{background:var(--palm);border-color:var(--palm);color:#fff;grid-column:1/-1}
.btn.ok{border-color:var(--palm);color:var(--palm)}
.btn:focus-visible{outline:3px solid var(--sunset);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--sunset)}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
.rank{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--sunset);font-variant-numeric:tabular-nums}
.st{font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.st.hecho{background:var(--palm-soft);color:var(--palm)}
details .inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
details.is-done summary{opacity:.6}
.note{font-size:.85rem;color:var(--muted)}
.warn{font-size:.85rem;color:var(--amber)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
footer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌴 GTA 6 Al Día</h1>
    <div class="meta" id="meta">Cargando clips…</div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  </header>

  <section id="now" aria-live="polite"></section>

  <section>
    <h2>Cola de hoy y próximos días</h2>
    <div class="list" id="list"></div>
  </section>

  <footer>
    <a class="btn" id="campana" target="_blank" rel="noopener">🎯 Abrir la campaña (Enviar clip)</a>
    <a class="btn" id="recortar" target="_blank" rel="noopener">🔄 Buscar directos nuevos ahora</a>
    <p class="note">La app se actualiza sola cuando hay clips nuevos. «Hecho» se guarda en este móvil.</p>
  </footer>
</div>

<script>
(function(){
  var KEY = "gta6-hechos";
  var hechos = {};
  try { hechos = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { hechos = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(hechos)); } catch (e) {} }
  var data = null;

  function el(tag, attrs, text){
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function idOf(c){ return data.tag + "/" + c.archivo; }
  function url(c){ return data.base + c.archivo; }

  function copyBtn(label, text){
    var b = el("button", {type:"button", "class":"btn"}, label);
    b.addEventListener("click", function(){
      function ok(){ b.textContent = "✅ Copiado"; b.classList.add("ok"); setTimeout(function(){ b.textContent = label; b.classList.remove("ok"); }, 1800); }
      try { navigator.clipboard.writeText(text).then(ok, function(){ window.prompt("Copia el texto:", text); }); }
      catch (e) { window.prompt("Copia el texto:", text); }
    });
    return b;
  }

  // Vídeo listo para el menú de compartir del iPhone (Guardar vídeo / TikTok / YouTube)
  var ficheros = {};
  function preparar(c, btn){
    var k = idOf(c);
    if (ficheros[k]) return ficheros[k];
    ficheros[k] = fetch(url(c)).then(function(r){
      if (!r.ok) throw new Error(r.status);
      var total = +r.headers.get("content-length") || 0, leido = 0, partes = [];
      var lector = r.body && r.body.getReader ? r.body.getReader() : null;
      if (!lector) return r.blob();
      function paso(){
        return lector.read().then(function(x){
          if (x.done) return new Blob(partes, {type:"video/mp4"});
          partes.push(x.value); leido += x.value.length;
          if (btn && total) btn.textContent = "⏳ Preparando vídeo… " + Math.round(leido / total * 100) + "%";
          return paso();
        });
      }
      return paso();
    }).then(function(blob){
      var f = new File([blob], c.archivo, {type:"video/mp4"});
      if (btn) btn.textContent = "📲 Guardar o enviar a TikTok";
      return f;
    }).catch(function(e){ delete ficheros[k]; if (btn) btn.textContent = "📲 Guardar o enviar a TikTok"; throw e; });
    return ficheros[k];
  }
  function compartirBtn(c, auto){
    var b = el("button", {type:"button", "class":"btn primary"}, "📲 Guardar o enviar a TikTok");
    var listo = null;
    function cargar(){ preparar(c, b).then(function(f){ listo = f; }, function(){}); }
    if (auto) cargar();
    b.addEventListener("click", function(){
      var puede = navigator.canShare && listo && navigator.canShare({files:[listo]});
      if (puede) {
        navigator.share({files:[listo], title:c.archivo}).catch(function(){});
      } else if (navigator.canShare && !listo) {
        b.textContent = "⏳ Preparando vídeo…";
        preparar(c, b).then(function(f){ listo = f; b.textContent = "✅ Listo: toca otra vez para guardar"; },
                            function(){ window.open(url(c), "_blank"); });
      } else {
        window.open(url(c), "_blank");  // sin menú de compartir: abre el vídeo (Compartir → Guardar vídeo)
      }
    });
    return b;
  }

  function actions(c, big){
    var box = el("div", {"class":"btns"});
    box.appendChild(compartirBtn(c, big));
    box.appendChild(copyBtn("📋 Texto TikTok", c.tiktok));
    box.appendChild(copyBtn("📋 Texto Shorts", c.shorts));
    var ver = el("a", {"class":"btn", href:url(c), target:"_blank", rel:"noopener", style:"grid-column:1/-1"}, "▶️ Abrir el vídeo (plan B: Compartir → Guardar vídeo)");
    box.appendChild(ver);
    var done = el("button", {type:"button", "class":"btn done"}, hechos[idOf(c)] ? "↩️ Marcar como pendiente" : "✅ Hecho: subido y enviado");
    done.addEventListener("click", function(){
      if (hechos[idOf(c)]) delete hechos[idOf(c)]; else hechos[idOf(c)] = Date.now();
      save(); render();
    });
    box.appendChild(done);
    return box;
  }

  function detail(c, big){
    var frag = document.createDocumentFragment();
    frag.appendChild(el("div", {"class":"why"}, "Por qué: " + c.porque));
    if (c.gancho) frag.appendChild(el("div", {"class":"hook"}, "💬 Título sugerido (lo que dice): “" + c.gancho + "”"));
    (c.avisos || []).forEach(function(a){ frag.appendChild(el("div", {"class":"warn"}, "⚠️ " + a)); });
    if (big) {
      var ol = el("ol", {"class":"steps"});
      ["Toca «Guardar o enviar a TikTok» → elige TikTok (o «Guardar vídeo»).",
       "Súbelo a TikTok con el texto de TikTok y a YouTube Shorts con el de Shorts.",
       "Copia el enlace de cada publicación y pégalo en «Enviar clip» de la campaña.",
       "Pulsa «Hecho»."].forEach(function(t){ ol.appendChild(el("li", null, t)); });
      frag.appendChild(ol);
    }
    frag.appendChild(actions(c, big));
    if (big) {
      var v = el("details");
      v.appendChild(el("summary", null, "▶️ Ver el vídeo antes de subirlo"));
      v.addEventListener("toggle", function(){
        if (v.open && !v.querySelector("video")) v.appendChild(el("video", {src:url(c), controls:"", preload:"metadata", playsinline:""}));
      });
      frag.appendChild(v);
    }
    return frag;
  }

  function render(){
    var clips = data.clips;
    var pend = clips.filter(function(c){ return !hechos[idOf(c)]; });
    var n = clips.length - pend.length;
    document.getElementById("fill").style.width = (clips.length ? n / clips.length * 100 : 0) + "%";
    var gen = new Date(data.generado);
    document.getElementById("meta").textContent =
      n + " de " + clips.length + " hechos · " + data.analizados + " clips analizados · actualizado " +
      gen.toLocaleString("es-ES", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});

    var now = document.getElementById("now");
    now.textContent = "";
    if (!pend.length) {
      now.appendChild(el("div", {"class":"empty"}, "🎉 Todo subido. Cuando Dom haga un directo nuevo, aparecerán clips nuevos aquí solos."));
    } else {
      var c = pend.slice().sort(function(a,b){ return a.cuando < b.cuando ? -1 : 1; })[0];
      var card = el("div", {"class":"now"});
      card.appendChild(el("span", {"class":"tag"}, "Sube este ahora"));
      card.appendChild(el("div", {"class":"when"}, "#" + c.rank + " · " + c.cuando_txt));
      card.appendChild(detail(c, true));
      now.appendChild(card);
    }

    var list = document.getElementById("list");
    list.textContent = "";
    clips.forEach(function(c){
      var d = el("details");
      if (hechos[idOf(c)]) d.classList.add("is-done");
      var s = el("summary");
      s.appendChild(el("span", {"class":"rank"}, "#" + c.rank));
      s.appendChild(el("span", null, c.cuando_txt));
      s.appendChild(el("span", {"class":"st" + (hechos[idOf(c)] ? " hecho" : "")}, hechos[idOf(c)] ? "Hecho" : "Pendiente"));
      d.appendChild(s);
      var inner = el("div", {"class":"inner"});
      inner.appendChild(detail(c, false));
      d.appendChild(inner);
      list.appendChild(d);
    });
  }

  fetch("data/clips.json?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      data = d;
      if (d.campana) document.getElementById("campana").href = d.campana; else document.getElementById("campana").hidden = true;
      if (d.recortar) document.getElementById("recortar").href = d.recortar; else document.getElementById("recortar").hidden = true;
      render();
    })
    .catch(function(){
      document.getElementById("meta").textContent = "Todavía no hay clips publicados aquí. Vuelve en un rato.";
      document.getElementById("campana").hidden = true;
      document.getElementById("recortar").hidden = true;
    });
})();
</script>
</body>
</html>
